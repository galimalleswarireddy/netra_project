a<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentPortfoloio</title>
</head>
<body>
    <main style="background: #fff5f8; padding: 20px; font-family:Arial; color: #4a4a4a;">
  
  <div style="background: linear-gradient(135deg, #ff758c, #ff7eb3); color: white; padding: 20px; border-radius: 16px; text-align: center;">
    <h1 style="margin: 0; font-size: 24px; font-weight: 600;">Student Portfolio</h1>
  </div>
  <section style="background: #ffffff; padding: 20px; margin-top: 16px; border-radius: 16px; text-align: center; box-shadow: 0 ">
   <h2>About Me</h2>
    <img src="profile.jpeg" alt="Malli" width="80" height="80" style="border-radius: 50%; border: 4px solid #ff758c;">
    <p style="margin: 4px 0 0;">Malli | CSE Student</p>
  </section>
   <section style="background: white; padding: 20px; margin-top: 16px; border-radius: 16px; ">
    <h2 style="margin-top: 0; color: #ff477e; font-size: 20px;">My Skills</h2>
    <ul style="display: flex; gap: 10px;list-style:None; padding: 0;">
      <li style="background: #fff0f3; color: #ff477e; padding: 8px 16px; border-radius: 20px;">HTML</li>
      <li style="background: #fff0f3; color: #ff477e; padding: 8px 16px; border-radius: 20px;">Python</li>
    </ul>
  </section>
   <section style="background: white; padding: 20px; margin-top: 16px; border-radius: 16px; border: 1px solid #ffe3ec; border-left: 5px solid #ff758c; box-shadow: 0">
    <h2 style="margin-top: 0; color: #ff477e; font-size: 20px;">My Projects</h2>
    <p style="margin: 0 0 12px; color: #666;">Registration Form . Library Page</p>
    </section>
   <section style="background: white; padding: 20px; margin-top: 16px; border-radius: 16px;">
    <h2 style="margin: 0 0 12px;color: #ff477e; font-size: 20px;">Course Registration</h2>
    <form>
      <label for="name">Full Name</label><br>
      <input id="name" name="name" type="text" required style=" box-sizing: border-box; "width: 100%;padding: 10px; margin: 6px 0 14px; background: #fff9fa; border: 1px solid #ffccd5; border-radius: 8px;"><br>
      <label for="email">Email</label><br>
    <input id="email" name="email" type="email" required style=" box-sizing:border box; width: 100%;border-box; padding: 10px; margin: 6px 0 14px; background: #fff9fa; border: 1px solid #ffccd5; border-radius: 8px;"><br>
      <label for="course">Course</label><br>
      <select id="course" name="course" style=" box-sizing: border-box;width: 100% padding:10px; margin:6px 0 14px;background: #fff9fa; border: 1px solid #ffccd5; border-radius: 8px;">
        <option>HTML</option>
        <option>Python</option>
      </select>
      <p >Learning Mode:
        <label><input type="radio" name="mode" value="online"> Online</label>
        <label><input type="radio" name="mode" value="offline"> Offline</label>
      </p>
      <label for="comments">Comments</label><br>
      <textarea id="comments" name="comments" rows="2" style=" box-sizing: border-box;width: 100%; padding: 10px; margin: 6px 0 14px; background: #fff9fa; border: 1px solid #ffccd5; border-radius: 8px;"></textarea>
      <label><input type="checkbox" name="agree"> I agree to the terms</label>
      <button type="submit" style="background: #ff477e ; color: white; border: none; padding: 10px 20px; border-radius: 8px; ">Register</button>
      <button type="reset" style="background: #fff0f3; color: #ff477e;border:0; padding: 10px 20px; border-radius: 8px; ">Reset</button>
    </form>
     </section>
    <section style="background: #ffffff; padding: 20px; margin-top: 16px; border-radius: 16px;">
    <h2 style="margin-top: 0; color: #ff477e; font-size: 20px;">Contact</h2>
    <a href="mailto:ananya@example.com" style="display: inline-block; background: #fff0f3; color: #ff477e; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px;">Email Me</a>
  </section>
</main>
</body>
</html>
